[project]
name = "dualmod"
version = "1.0.0"
description = "Dual-Mod attention: a nilpotent recurrence inside softmax attention (model, WaveScan engines, LM and formal-language harnesses)"
requires-python = ">=3.12"
dependencies = [
    "torch==2.12.1",
    "triton==3.7.1",
    "numpy>=2.5.0",
    "tqdm>=4.68.3",
]

[project.optional-dependencies]
# language-model training + evaluation (SlimPajama / FineWeb-Edu pipelines, lm-eval battery)
lm = [
    "transformers>=5.13.0",
    "datasets>=5.0.0",
    "pyarrow>=24.0.0",
    "huggingface-hub>=1.0",
    "tiktoken>=0.13.0",
    "lm-eval==0.4.12",
    "wonderwords==3.0.1",
    "nltk>=3.10",
    "httpx", "html2text", "beautifulsoup4",
    "einops>=0.8",
    "wandb>=0.28.0",
]
# Gated DeltaNet baselines (340M LM arm and the formal-language `--arch gdn` arm).
# fla 0.5.1 wants transformers 4.57 and tilelang on Hopper; use a separate environment.
gdn = [
    "flash-linear-attention==0.5.1",
    "fla-core==0.5.1",
    "transformers==4.57.1",
    "tilelang==0.1.12",
]
figures = ["matplotlib>=3.11.0", "pillow"]
dev = ["pytest>=9.1.1"]

[tool.setuptools]
packages = ["models", "engines", "lm", "formal_language", "tinystories"]

[tool.pytest.ini_options]
testpaths = ["tests", "engines/wavescan/tests"]
